<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto Mono', monospace;
            height: 100vh;
            background: linear-gradient(135deg, #0a000f, #1a0022, #000000);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            color: #cc66ff;
        }

        /* Purple Neon Background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(187, 0, 255, 0.20) 0%, transparent 60%),
                radial-gradient(circle at 70% 70%, rgba(120, 0, 200, 0.18) 0%, transparent 60%);
            animation: purplePulse 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes purplePulse {
            0% { opacity: 0.75; }
            100% { opacity: 1; }
        }

        .nav-decoration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #cc66ff, #9900cc, transparent);
            box-shadow: 0 0 20px #cc66ff;
        }

        .container {
            background: rgba(10, 0, 15, 0.78);
            backdrop-filter: blur(20px);
            padding: 40px 50px;
            border-radius: 16px;
            width: 400px;
            border: 1px solid #cc66ff;
            box-shadow: 0 0 35px rgba(204, 102, 255, 0.35);
            text-align: center;
            display: none;
        }

        .container h2 {
            font-family: 'Orbitron', sans-serif;
            color: #cc66ff;
            text-align: center;
            margin-bottom: 35px;
            font-size: 26px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px #cc66ff,
                         0 0 40px #9900cc;
            line-height: 1.1;
        }

        .container h2 span {
            display: block;
            font-size: 23px;
            letter-spacing: 3px;
            margin-top: 8px;
        }

        .input-group {
            margin-bottom: 22px;
            text-align: left;
        }

        .input-group label {
            color: #dd99ff;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #660099;
            border-radius: 8px;
            color: #ffddff;
            font-size: 15px;
            font-family: 'Roboto Mono', monospace;
        }

        .input-group input:focus {
            outline: none;
            border-color: #cc66ff;
            box-shadow: 0 0 15px #cc66ff;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #9900cc, #cc66ff);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            letter-spacing: 1px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px #cc66ff;
        }

        .loading, .result {
            color: #dd99ff;
            font-size: 18px;
            text-align: center;
            font-family: 'Roboto Mono', monospace;
        }

        .result {
            display: none;
            color: #ff66aa;
            font-size: 17px;
            text-shadow: 0 0 15px #ff66aa;
        }
    </style>
</head>
<body>
    <div class="nav-decoration"></div>
    
    <!-- Loading -->
    <div id="loading" class="loading">
        <p>🔍 Memeriksa device...</p>
    </div>

    <!-- Form Registrasi -->
    <div id="formContainer" class="container">
        <h2>
            REGISTRASI<br>
            <span>LKY MOD VIP 👑</span>
        </h2>
        <div class="input-group">
            <label>👤 USERNAME</label>
            <input type="text" id="username" placeholder="Masukkan username">
        </div>
        <div class="input-group">
            <label>🔒 PASSWORD</label>
            <input type="password" id="password" placeholder="Masukkan password">
        </div>
        <button id="registerBtn">🚀 DAFTAR</button>
    </div>

    <!-- Result -->
    <div id="result" class="result">
        <p>⚠️ Device anda tidak support untuk aplikasi Regis</p>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('formContainer').style.display = 'block';
        }, 2200);

        document.getElementById('registerBtn').addEventListener('click', function() {
            const btn = this;
            const form = document.getElementById('formContainer');
            const result = document.getElementById('result');

            btn.innerHTML = '⏳ MEMPROSES REGISTRASI...';
            btn.disabled = true;

            const delay = Math.floor(Math.random() * 4000) + 1500;

            setTimeout(() => {
                form.style.display = 'none';
                result.style.display = 'block';
            }, delay);
        });
    </script>
</body>
</html>
