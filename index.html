<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LKYMOD VIP</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      color: #eae6ff;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #05010a, #120018, #000000);
    }

    video.bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15,0,25,0.55);
      z-index: -1;
    }

    .topbar {
      display: flex;
      align-items: center;
      padding: 15px;
      background: rgba(20,0,30,0.35);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(178,102,255,0.18);
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 1000;
    }

    .menu-btn {
      font-size: 28px;
      cursor: pointer;
      margin-right: 15px;
      color: #c084ff;
    }

    .typing-text {
      font-size: 15px;
      font-weight: 600;
      color: #c084ff;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #c084ff;
      animation: blink 0.7s infinite;
      text-shadow: 0 0 10px rgba(178,102,255,0.6);
      letter-spacing: 1px;
      background: rgba(20,0,30,0.35);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid rgba(178,102,255,0.2);
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -200px;
      width: 190px;
      height: 100%;
      background: rgba(20,0,30,0.35);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(178,102,255,0.18);
      padding-top: 70px;
      transition: 0.4s;
      z-index: 999;
    }

    .sidebar a {
      display: block;
      padding: 13px;
      color: #e8d9ff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: 0.3s;
      font-size: 13px;
    }

    .sidebar a:hover {
      background: rgba(178,102,255,0.18);
      color: #d6b3ff;
      padding-left: 22px;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .register-box {
      width: 350px;
      background: rgba(20,0,30,0.25);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(178,102,255,0.2);
      border-radius: 26px;
      padding: 30px;
      box-shadow: 0 0 35px rgba(178,102,255,0.18);
      position: relative;
      overflow: hidden;
    }

    .register-box::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 140px;
      height: 140px;
      background: rgba(178,102,255,0.15);
      border-radius: 50%;
      filter: blur(10px);
    }

    .register-box h2 {
      text-align: center;
      margin-bottom: 28px;
      color: #e8d9ff;
      font-size: 24px;
      letter-spacing: 3px;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(178,102,255,0.35);
    }

    .register-box input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid rgba(178,102,255,0.25);
      border-radius: 14px;
      outline: none;
      background: rgba(20,0,30,0.25);
      color: white;
      font-size: 13px;
      transition: 0.3s;
    }

    .register-box input:focus {
      border-color: #c084ff;
      box-shadow: 0 0 12px rgba(178,102,255,0.35);
    }

    .register-box button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #5b1eff, #c084ff);
      color: white;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 18px rgba(178,102,255,0.25);
    }

    .register-box button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(178,102,255,0.45);
    }

    .status {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      min-height: 20px;
      color: #ffb3ff;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <video class="bg-video" autoplay muted loop>
    <source src="background.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <!-- 🔊 TAMBAHAN MP3 (ONLY ADD, NO EDIT OTHER PART) -->
  <audio id="clickSound" src="click.mp3" preload="auto"></audio>

  <div class="topbar">
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <div class="typing-text" id="typing"></div>
  </div>

  <div class="sidebar" id="sidebar">
    <a href="https://t.me/lkymodvip" target="_blank"><img src='https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg' width='18' style='vertical-align:middle;margin-right:10px;'> Telegram</a>
    <a href="https://wa.me/6285809549179" target="_blank"><img src='https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg' width='18' style='vertical-align:middle;margin-right:10px;'> WhatsApp</a>
    <a href="https://www.tiktok.com/@lkymodvvip?_r=1&_t=ZS-96I1XZssrTc" target="_blank"><img src='https://cdn-icons-png.flaticon.com/512/3046/3046121.png' width='18' style='vertical-align:middle;margin-right:10px;'> TikTok</a>
  </div>

  <div class="container">
    <div class="register-box">
      <h2>LKYMOD VIP</h2>

      <input type="text" id="username" placeholder="👤 Username">
      <input type="password" id="password" placeholder="🔒 Password">

      <button onclick="register()">DAFTAR</button>

      <div class="status" id="status"></div>
    </div>
  </div>

  <script>
    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');

      if (sidebar.style.left === '0px') {
        sidebar.style.left = '-260px';
      } else {
        sidebar.style.left = '0px';
      }
    }

    function register() {
      const status = document.getElementById('status');
      document.getElementById('clickSound').play();

      status.style.color = '#ffff00';
      status.innerHTML = 'Memproses Registrasi...';

      const delay = Math.floor(Math.random() * 5000) + 5000;

      setTimeout(() => {
        status.style.color = '#ff4444';
        status.innerHTML = 'Device anda tidak support untuk aplikasi Regis';
      }, delay);
    }

    const text = 'REGISTRASI LKYMOD VIP';
    let i = 0;
    let deleting = false;

    function typingEffect() {
      const typing = document.getElementById('typing');

      if (!deleting) {
        typing.innerHTML = text.substring(0, i);
        i++;

        if (i > text.length) {
          deleting = true;
          setTimeout(typingEffect, 1000);
          return;
        }
      } else {
        typing.innerHTML = text.substring(0, i);
        i--;

        if (i < 0) {
          deleting = false;
          i = 0;
        }
      }

      setTimeout(typingEffect, deleting ? 60 : 100);
    }

    typingEffect();
  </script>

</body>
</html>
